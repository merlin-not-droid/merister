name: Deploy Meister site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/meister-homepage-planning-mlx3gx
    paths:
      - 'meister/**'
      - '.github/workflows/meister-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meister
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: meister/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install
        run: npm ci

      - name: Build (typecheck + prerender)
        env:
          # 프로젝트 페이지(/merister/) 또는 커스텀 도메인(/)에 맞춰 자동으로 설정됩니다.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # 저장소 Settings → Secrets and variables → Actions → Variables 에서 설정
          VITE_FORM_ENDPOINT: ${{ vars.VITE_FORM_ENDPOINT }}
          VITE_SHOW_DIRECTION_SWITCHER: ${{ vars.VITE_SHOW_DIRECTION_SWITCHER || 'true' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: meister/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
