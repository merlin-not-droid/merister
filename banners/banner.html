<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AC PRO 배너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Noto+Sans+KR:wght@500;700&display=block" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2ea; --ink:#2f3347; --ink2:#6b6f82;
    --blue:#cfe0f3; --peach:#ffd9c7; --mint:#cdebdc; --lav:#dfd6f3; --butter:#fff0b8;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg)}
  #stage{position:relative;overflow:hidden;background:var(--bg)}
  #bg{position:absolute;inset:0}
  .band{position:absolute}
  .content{position:absolute;left:0;top:0;width:1546px;height:423px;transform-origin:0 0;color:var(--ink)}

  /* logo */
  .logo{position:absolute;left:30px;top:62px;display:flex;align-items:center;gap:34px}
  .tile{width:156px;height:156px;border-radius:44px;background:var(--blue);display:grid;place-items:center}
  .tile svg{width:104px;height:104px}
  .word{font:800 164px/1 'Outfit',sans-serif;letter-spacing:-.035em;white-space:nowrap}
  .word span{color:#8fb3dc}
  .kr{position:absolute;left:34px;top:262px;font:700 34px 'Noto Sans KR',sans-serif;letter-spacing:-.01em;white-space:nowrap}
  .kr small{font:500 26px 'Outfit',sans-serif;color:var(--ink2);letter-spacing:.06em;margin-left:14px}
  .tag{position:absolute;left:34px;top:322px;font:500 28px 'Noto Sans KR',sans-serif;color:var(--ink2);white-space:nowrap}

  /* SPOCAST card */
  .card{position:absolute;left:952px;top:52px;width:560px;height:236px;border-radius:36px;background:var(--peach)}
  .label{position:absolute;left:40px;top:36px;font:700 19px 'Outfit',sans-serif;letter-spacing:.2em;color:var(--ink);
    display:flex;align-items:center;gap:10px}
  .label i{width:10px;height:10px;border-radius:50%;background:#ff8a7a;display:block}
  .spocast{position:absolute;left:36px;top:76px;font:800 92px/1 'Outfit',sans-serif;letter-spacing:-.03em}
  .cardsub{position:absolute;left:40px;top:178px;font:500 24px 'Noto Sans KR',sans-serif;color:#5d5560}
  .mic{position:absolute;right:40px;top:40px;width:64px;height:96px}

  .chips{position:absolute;left:952px;top:316px;display:flex;gap:12px}
  .chip{font:700 23px 'Noto Sans KR',sans-serif;padding:13px 26px;border-radius:999px;white-space:nowrap}
  .chip.en{font:700 23px 'Outfit',sans-serif;letter-spacing:.04em}
</style>
</head>
<body>
<div id="stage">
  <svg id="bg"></svg>
  <div class="band" id="band">
    <div class="content" id="content">
      <div class="logo">
        <div class="tile">
          <!-- minimal armchair -->
          <svg viewBox="0 0 64 64" fill="none" stroke="#2f3347" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 31 V22 a9 9 0 0 1 9 -9 h16 a9 9 0 0 1 9 9 V31"/>
            <path d="M9 45 V35 a5 5 0 0 1 10 0 V39 H45 V35 a5 5 0 0 1 10 0 V45 Z"/>
            <path d="M15 45 V51 M49 45 V51"/>
          </svg>
        </div>
        <div class="word">AC <span>PRO</span></div>
      </div>
      <div class="kr">방구석 전문가<small>ARMCHAIR PRO</small></div>
      <div class="tag">진지하게 분석하고, 편하게 떠듭니다.</div>

      <div class="card">
        <div class="label"><i></i>MAIN SHOW</div>
        <svg class="mic" viewBox="0 0 64 96" fill="none" stroke="#2f3347" stroke-width="4.4" stroke-linecap="round">
          <rect x="20" y="4" width="24" height="44" rx="12"/>
          <path d="M8 36 C 8 66, 56 66, 56 36"/>
          <path d="M32 62 V80 M20 86 H44"/>
        </svg>
        <div class="spocast">SPOCAST</div>
        <div class="cardsub">스포츠 이야기, 방구석에서 제대로.</div>
      </div>

      <div class="chips">
        <div class="chip" style="background:var(--mint)">스포츠 분석</div>
        <div class="chip en" style="background:var(--lav)">SPOFLOW</div>
        <div class="chip" style="background:var(--butter)">브이로그</div>
      </div>
    </div>
  </div>
</div>

<script>
const PRESETS = {
  // YouTube: 2560x1440, key content inside the centre 1546x423
  youtube: {W:2560, H:1440, band:{x:507, y:508, w:1546, h:423}, scale:1},
  // CHZZK: 1920x480, key content inside the centre 1200x480
  chzzk:   {W:1920, H:480,  band:{x:360, y:0, w:1200, h:480}, scale:1200/1546}
};
const key = new URLSearchParams(location.search).get('size') || 'youtube';
const P = PRESETS[key];
const stage = document.getElementById('stage');
stage.style.width = P.W+'px'; stage.style.height = P.H+'px';
const cw = 1546*P.scale, ch = 423*P.scale;
const band = document.getElementById('band');
band.style.left = (P.band.x + (P.band.w-cw)/2)+'px';
band.style.top  = (P.band.y + (P.band.h-ch)/2)+'px';
band.style.width = cw+'px'; band.style.height = ch+'px';
document.getElementById('content').style.transform = `scale(${P.scale})`;

// soft pastel blobs, kept away from the text
const {W,H} = P;
const my = P.band.y + P.band.h/2;
const s = key==='youtube' ? 1 : 0.8;
const blob = (cx,cy,r,c,o)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c}" opacity="${o}"/>`;
const bg = document.getElementById('bg');
bg.setAttribute('viewBox',`0 0 ${W} ${H}`); bg.setAttribute('width',W); bg.setAttribute('height',H);
bg.innerHTML = `
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="${60*s}"/></filter>
    <pattern id="dots" width="${40*s}" height="${40*s}" patternUnits="userSpaceOnUse">
      <circle cx="${20*s}" cy="${20*s}" r="${1.8*s}" fill="#2f3347" opacity=".07"/>
    </pattern>
  </defs>
  <rect width="${W}" height="${H}" fill="url(#dots)"/>
  <g filter="url(#soft)">
    ${blob(P.band.x-150*s, my-60*s, 260*s, '#ffd9c7', .9)}
    ${blob(P.band.x+P.band.w+170*s, my+40*s, 280*s, '#cfe0f3', .95)}
    ${blob(P.band.x-60*s, my+260*s, 200*s, '#cdebdc', .9)}
    ${blob(P.band.x+P.band.w+60*s, my-260*s, 180*s, '#fff0b8', .9)}
    ${blob(P.band.x+P.band.w*0.55, my+330*s, 160*s, '#dfd6f3', .8)}
  </g>
`;
window.__ready = document.fonts.ready.then(()=>true);
</script>
</body>
</html>
