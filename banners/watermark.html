<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AC PRO 워터마크</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:transparent}
  /* badge: YouTube branding watermark (square, shown small in the video corner) */
  .wm{position:relative;width:600px;height:600px}
  .badge{position:absolute;inset:20px;border-radius:50%;background:#cfe0f3;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .badge svg{width:230px;height:230px;margin-top:-20px}
  .badge .w{font:800 128px/1 'Outfit',sans-serif;letter-spacing:-.04em;color:#2f3347;margin-top:-26px}
  /* pill: transparent-background overlay for your own edits / CHZZK */
  .pillwrap{width:1000px;height:320px;display:flex;align-items:center;justify-content:center}
  .pill{display:flex;align-items:center;gap:30px;background:#f7f2ea;border-radius:999px;padding:30px 60px 30px 36px}
  .pill .ic{width:200px;height:200px;border-radius:50%;background:#cfe0f3;display:grid;place-items:center}
  .pill .ic svg{width:140px;height:140px}
  .pill .w{font:800 168px/1 'Outfit',sans-serif;letter-spacing:-.04em;color:#2f3347;white-space:nowrap}
  .pill .w span{color:#8fb3dc}
</style>
</head>
<body>
  <template id="chair">
    <svg viewBox="0 0 64 64" fill="none" stroke="#2f3347" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 31 V22 a9 9 0 0 1 9 -9 h16 a9 9 0 0 1 9 9 V31"/>
      <path d="M9 45 V35 a5 5 0 0 1 10 0 V39 H45 V35 a5 5 0 0 1 10 0 V45 Z"/>
      <path d="M15 45 V51 M49 45 V51"/>
    </svg>
  </template>
  <div class="wm" id="badge"><div class="badge"><div class="slot"></div><div class="w">AC PRO</div></div></div>
  <div class="pillwrap" id="text"><div class="pill"><div class="ic slot"></div><div class="w">AC <span>PRO</span></div></div></div>
<script>
  const t = document.getElementById('chair').innerHTML;
  document.querySelectorAll('.slot').forEach(e => e.innerHTML = t);
  document.querySelector('#badge .slot').outerHTML = t;
  window.__ready = document.fonts.ready.then(()=>true);
</script>
</body>
</html>
